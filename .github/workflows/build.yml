name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: unzip -o rutina-daniel.zip

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Compilar APK debug
        working-directory: rutina-daniel
        run: gradle assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: rutina-daniel-apk
          path: rutina-daniel/app/build/outputs/apk/debug/app-debug.apk
